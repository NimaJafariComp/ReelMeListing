[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "listing-to-reel"
version = "0.1.0"
description = "Auditable generative-media pipeline for real-estate marketing."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Listing-to-Reel contributors" }]
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "structlog>=24.4,<26",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]
mps = [
  "torch>=2.6",
]
gpu = [
  "torch>=2.6",
  "diffusers>=0.32",
  "transformers>=4.48",
  "accelerate>=1.3",
  "safetensors>=0.5",
]

[project.scripts]
ltr = "listing_to_reel.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
