image_editor:
  provider: diffusers
  adapter: instruct_pix2pix
  model_id: timbrooks/instruct-pix2pix
  model_revision: null
  scheduler: euler_ancestral
  # MPS uses float32 for reliable VAE decoding; use float16 in a CUDA-specific override.
  torch_dtype: float32
  num_inference_steps: 20
  guidance_scale: 7.5
  image_guidance_scale: 1.5
  candidate_count: 2
  max_dimension: 512
  output_quality: 95
